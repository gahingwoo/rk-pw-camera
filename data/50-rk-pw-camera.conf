# Installed by rk-pw-camera.
#
# The Rockchip vendor camera stack registers ~50 V4L2 nodes (rkcif, rkisp,
# rkvpss). None of them is usable by PipeWire's V4L2 monitor: they are
# internal pipeline stages or multi-planar outputs. rk-pw-camera publishes
# the camera instead, so hide them all from desktop apps.
monitor.v4l2.rules = [
  {
    matches = [
      { device.bus-path = "~platform-rkcif.*" }
      { device.bus-path = "~platform-rkisp.*" }
      { device.bus-path = "~platform-rkvpss.*" }
    ]
    actions = { update-props = { device.disabled = true } }
  }
]
